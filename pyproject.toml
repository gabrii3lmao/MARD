[project]
name = "mard"
version = "0.1.0"
description = "API FastAPI com SQLAlchemy assíncrono e PostgreSQL"
authors = [
    {name = "gabriel@luz",email = "gabrielmluz56@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.148.0,<0.149.0)",
    "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "typos (>=1.51.1,<2.0.0)",
    "httpx2 (>=2.14.0,<3.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)",
    "testcontainers (>=4.15.0,<5.0.0)"
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 79
target-version = "py314"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "I", "F", "E", "W", "PL", "PT",
    "B", "UP", "ASYNC", "RUF", "SIM", "C4",
]

[tool.ruff.lint.isort]
known-first-party = ["mard"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.format]
preview = true
quote-style = "single"
indent-style = "space"

# ---------------------------------------------------------------------------
# Typos
# ---------------------------------------------------------------------------
[tool.typos.default.extend-words]
Classe = "Classe"
Gere = "Gere"
responde = "responde"
simular = "simular"

[tool.typos.files]
extend-exclude = [
    ".venv",
    "htmlcov",
    "poetry.lock",
    "README.md",
    ".pytest_cache",
    ".ruff_cache",
]

# ---------------------------------------------------------------------------
# Pytest / coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-p", "no:warnings",
    "--cov=mard",
    "--cov-report=term-missing",
    "--cov-context=test",
]

[tool.coverage.run]
source = ["mard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
show_contexts = true

# ---------------------------------------------------------------------------
# Poe (task runner)
# ---------------------------------------------------------------------------
[tool.poe.tasks]
lint = "ruff check ."
format = [
    { cmd = "ruff check --fix ." },
    { cmd = "ruff format ." },
]
test = [
    { cmd = "pytest $POE_EXTRA_ARGS" },
    { cmd = "coverage html" },
]
serve = "fastapi dev mard/app.py"
db-up = "docker compose up -d db"
db-down = "docker compose down"
db-reset = [
    { cmd = "docker compose down -v" },
    { cmd = "docker compose up -d db" },
]
migrate = "alembic upgrade head"

[tool.poe.tasks.migration]
help = "Gera uma migração automática: poe migration 'cria users'"
cmd = 'alembic revision --autogenerate -m "${message}"'

[[tool.poe.tasks.migration.args]]
name = "message"
positional = true
required = true
help = "descrição da migração"
